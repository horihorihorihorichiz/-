<title>型の家 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#f1eee6; --panel:#fbfaf6; --panel2:#f4f1ea; --ink:#26221d; --sub:#6f675c;
  --line:#dcd5c8; --accent:#b8432b; --accent-soft:#f6e3dd; --wood:#c8a165;
  --ok:#3e6b47;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;
  --mono:'Roboto Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1c1b19; --panel:#26241f; --panel2:#2e2b25; --ink:#ece7dc; --sub:#a39b8c;
    --line:#3a362f; --accent:#e08a6e; --accent-soft:#3d2a24; --wood:#c8a165; --ok:#9ccaa6;
  }
}
:root[data-theme="dark"]{
  --paper:#1c1b19; --panel:#26241f; --panel2:#2e2b25; --ink:#ece7dc; --sub:#a39b8c;
  --line:#3a362f; --accent:#e08a6e; --accent-soft:#3d2a24; --wood:#c8a165; --ok:#9ccaa6;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;
  line-height:1.6;overflow:hidden}
.app{display:grid;grid-template-columns:1fr 300px;grid-template-rows:auto 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:baseline;gap:14px;padding:10px 18px 8px;
  border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:19px;font-weight:700;letter-spacing:.02em}
header .sub{color:var(--sub);font-size:12.5px}
header .hint{margin-left:auto;color:var(--sub);font-size:12px;font-family:var(--mono)}
#stage{position:relative;overflow:hidden;background:var(--paper)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
#cap{position:absolute;left:14px;bottom:14px;max-width:min(560px,calc(100% - 28px));
  background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;backdrop-filter:blur(6px)}
#cap b{color:var(--accent)}
#cap .n{font-family:var(--mono);font-size:11.5px;color:var(--sub);letter-spacing:.08em}
#cap p{margin-top:2px;font-size:13.5px}
#cap .sheet{margin-top:4px;font-size:12px;color:var(--sub)}
#cap .sheet b{color:var(--ok)}
aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;
  padding:14px 14px 22px;display:flex;flex-direction:column;gap:18px}
aside h2{font-size:11.5px;letter-spacing:.14em;color:var(--sub);font-weight:700;
  margin-bottom:8px}
.steps{list-style:none;display:flex;flex-direction:column;gap:3px}
.steps button{width:100%;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;
  text-align:left;font:inherit;font-size:13.5px;color:var(--ink);background:none;border:0;
  border-radius:7px;padding:5px 8px;cursor:pointer}
.steps button .k{font-family:var(--mono);font-size:11px;color:var(--sub)}
.steps button:hover{background:var(--panel2)}
.steps button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.steps button.on .k{color:var(--accent)}
.steps button.done{color:var(--ink)}
.steps button.todo{color:var(--sub)}
.row{display:flex;flex-wrap:wrap;gap:6px}
.btn{font:inherit;font-size:12.5px;padding:6px 11px;border:1px solid var(--line);
  border-radius:7px;background:var(--panel2);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;
  border:1px solid var(--line);border-radius:99px;cursor:pointer;background:var(--panel2)}
.chip input{accent-color:var(--accent);margin:0}
label.slider{display:block;font-size:12.5px;color:var(--sub)}
input[type=range]{width:100%;accent-color:var(--accent)}
.legend{font-size:12px;color:var(--sub);display:grid;grid-template-columns:auto 1fr;gap:3px 8px;
  align-items:center}
.legend i{display:inline-block;width:18px;height:10px;border-radius:2px}
.rooms{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.rooms .fl{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.rooms .fl b{font-family:var(--mono);font-size:11px;color:var(--sub);width:26px}
.rooms button{font:inherit;font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel2);color:var(--ink);cursor:pointer}
.rooms button.here{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.tiny{font-size:11.5px;color:var(--sub);margin-top:6px}
body.walk #cap .n{color:var(--ok)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  header{grid-column:1}
  aside{border-left:0;border-top:1px solid var(--line);max-height:44vh}
  header .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
<header>
  <h1>型の家 3D</h1>
  <span class="sub">木造3階建て 併用住宅　8マス×10マス（7,280×9,100）</span>
  <span class="hint">ドラッグで回す／ホイールで寄る／2本指で寄る</span>
</header>
<div id="stage">
  <div id="cap"><div class="n">STEP 0</div><b id="capT"></b><p id="capP"></p><div class="sheet" id="capS"></div></div>
</div>
<aside>
  <section>
    <h2>建てる順番</h2>
    <ol class="steps" id="steps"></ol>
    <div class="row" style="margin-top:8px">
      <button class="btn primary" id="play">▶ 順番に建てる</button>
      <button class="btn" id="prev">←</button><button class="btn" id="next">→</button>
    </div>
  </section>
  <section>
    <h2>内覧（中を歩く）</h2>
    <div class="row">
      <button class="btn primary" id="tour">🚶 玄関から内覧する</button>
      <button class="btn" id="exit" hidden>外から見る</button>
    </div>
    <div id="rooms" class="rooms"></div>
    <p class="tiny">部屋を押すとそこまで歩きます。ドラッグで見回す／↑↓で前後、←→で向きを変える</p>
  </section>
  <section>
    <h2>見る</h2>
    <div class="row" id="views">
      <button class="btn" data-v="se">南東から</button>
      <button class="btn" data-v="s">南から</button>
      <button class="btn" data-v="e">東から</button>
      <button class="btn" data-v="top">真上から（伏図の目）</button>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="chip"><input type="checkbox" id="f1" checked>1階</label>
      <label class="chip"><input type="checkbox" id="f2" checked>2階</label>
      <label class="chip"><input type="checkbox" id="f3" checked>3階</label>
      <label class="chip"><input type="checkbox" id="f4" checked>屋根</label>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="chip"><input type="checkbox" id="walls" checked>壁を見せる</label>
      <label class="chip"><input type="checkbox" id="labels" checked>部屋の名前</label>
      <label class="chip"><input type="checkbox" id="spin">自動で回す</label>
    </div>
    <label class="slider" style="margin-top:10px">階をはなして見る
      <input type="range" id="explode" min="0" max="2500" step="50" value="0"></label>
  </section>
  <section>
    <h2>色の意味</h2>
    <div class="legend">
      <i style="background:#a83c2a"></i><span>通し柱（四すみ・1本もの）</span>
      <i style="background:#7a5230"></i><span>管柱（各階ごと）</span>
      <i style="background:#b58d52"></i><span>胴差・梁・桁・小屋梁</span>
      <i style="background:#c8a165"></i><span>土台・垂木・母屋・棟木</span>
      <i style="background:#e6ddcc;border:1px solid #bbb"></i><span>壁（薄い）・床の合板</span>
      <i style="background:#8fb8cf"></i><span>窓・掃き出し窓</span>
      <i style="background:#5c6570"></i><span>屋根（4寸・軒の出600）</span>
    </div>
  </section>
</aside>
</div>

const mats = {};
function mat(key, opt){
  const k = key + JSON.stringify(opt || {});
  if (!mats[k]) mats[k] = new THREE.MeshLambertMaterial(Object.assign({color: COL[key]}, opt || {}));
  return mats[k];
}
// x: 東, y: 上, z: 南（平面図のyは北向きなので z = -y*M）
function box(group, key, x0, x1, y0, y1, z0, z1, opt){
  const g = new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0));
  const m = new THREE.Mesh(g, mat(key, opt));
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  group.add(m); return m;
}
function X(gx){ return gx * M; }
function Z(gy){ return -gy * M; }

function label(text, size, color, bg){
  const c = document.createElement('canvas'); const px = 44;
  const ctx = c.getContext('2d'); ctx.font = `600 ${px}px ${getComputedStyle(document.body).fontFamily}`;
  const w = Math.ceil(ctx.measureText(text).width) + 28; c.width = w; c.height = px + 24;
  ctx.font = `600 ${px}px ${getComputedStyle(document.body).fontFamily}`;
  if (bg){ ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(0, 0, w, c.height, 14); ctx.fill(); }
  ctx.fillStyle = color; ctx.textBaseline = 'middle'; ctx.fillText(text, 14, c.height / 2);
  const t = new THREE.CanvasTexture(c); t.minFilter = THREE.LinearFilter;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map: t, transparent: true, depthTest: false}));
  s.scale.set(w / c.height * size, size, 1); s.renderOrder = 10; return s;
}

  for (const [gx, gy] of DATA.floors[n].kuda)

const FACE = {S: ['H', 0], N: ['H', NY], W: ['V', 0], E: ['V', NX]};
function walls(n, g){
  const d = DATA.floors[n], y0 = FL[n], y1 = WALL_TOP[n];
  const SILL = 800, HEAD = 2100;
  for (const [ori, ln, a, b] of d.walls){
    const spans = [];
    for (const [f, p, l, k] of d.openings){ const [o2, l2] = FACE[f]; if (o2 === ori && l2 === ln) spans.push([p, p + l, k]); }
    for (const [o2, w, p, l] of d.doors) if (o2 === ori && w === ln) spans.push([p, p + l, 'door']);
    spans.sort((u, v) => u[0] - v[0]);
    const piece = (p0, p1, h0, h1, key, opt) => {
      if (p1 - p0 < 0.01 || h1 - h0 < 1) return;
      const t = key === 'glass' ? 20 : 57;   // 壁は柱（±60）より少し薄くして面が重ならないようにする
      const m = ori === 'H'
        ? box(g, key, X(p0), X(p1), y0 + h0, y0 + h1, Z(ln) + t, Z(ln) - t, opt)
        : box(g, key, X(ln) - t, X(ln) + t, y0 + h0, y0 + h1, Z(p0), Z(p1), opt);
      if (key === 'wall') wallMeshes.push(m);
    };
    let cur = a;
    for (const [p0, p1, k] of spans){
      const q0 = Math.max(p0, a), q1 = Math.min(p1, b); if (q1 <= q0) continue;
      piece(cur, q0, 0, y1 - y0, 'wall', {transparent: true, opacity: 0.92});
      if (k === 'win'){ piece(q0, q1, 0, SILL, 'wall', {transparent: true, opacity: 0.92}); piece(q0, q1, SILL, HEAD, 'glass', {transparent: true, opacity: 0.5}); }
      else if (k === 'balc' || k === 'entry') piece(q0, q1, 0, HEAD, 'glass', {transparent: true, opacity: k === 'balc' ? 0.5 : 0.25});
      piece(q0, q1, HEAD, y1 - y0, 'wall', {transparent: true, opacity: 0.92});
      cur = q1;
    }
    piece(cur, b, 0, y1 - y0, 'wall', {transparent: true, opacity: 0.92});
  }
  box(g, 'floor', X(0), X(NX), y0 - 39, y0, Z(0), Z(NY), {transparent: true, opacity: 0.35});
  for (const [nm, ar, a, b, c, e] of d.rooms){
    const s = label(nm.replace(/\s+/g, ''), 420, '#26221d', 'rgba(255,255,255,.82)');
    s.position.set(X((a + c) / 2), y0 + 1500, Z((b + e) / 2)); labelGroups[n].add(s);
  }
}

function beams(list, top, g, key){
  for (const [ori, ln, a, b, size] of list){

    const e = 60 / M;
    if (ori === 'H') box(g, key, X(a + e), X(b - e), top - dep, top, Z(ln) + 60, Z(ln) - 60);
    else box(g, key, X(ln) - 60, X(ln) + 60, top - dep, top, Z(a + e), Z(b - e));
  }
}
beams(DATA.framing.f2, H.beam_top['2'], groups[3], 'beam');
beams(DATA.framing.f3, H.beam_top['3'], groups[6], 'beam');
beams(DATA.framing.roof, H.noki, groups[9], 'beam');

// ---------- 小屋組・屋根
const RX = X(R.ridge_x), RUN = RX + R.eave, RISE = RUN * R.slope, ANG = Math.atan(R.slope);
function yb(x){ return H.noki + R.slope * (RX - Math.abs(x - RX)); }   // 垂木の下端
(function(){
  const g = groups[9], z0 = Z(0) + R.kerava, z1 = Z(NY) - R.kerava;
  for (const gx of [1, 2, 3, 5, 6, 7]) box(g, 'moya', X(gx) - 45, X(gx) + 45, yb(X(gx)) - 90, yb(X(gx)), z0, z1);
  box(g, 'moya', RX - 60, RX + 60, yb(RX) - 120, yb(RX), z0, z1);                       // 棟木
  for (let gx = 1; gx < NX; gx++) for (const gy of [2, 4, 6, 8]){                         // 小屋束
    const top = yb(X(gx)) - (gx === 4 ? 120 : 90);
    box(g, 'moya', X(gx) - 45, X(gx) + 45, H.noki, top, Z(gy) + 45, Z(gy) - 45);
  }
  const L = Math.sqrt(RUN * RUN + RISE * RISE);
  for (let z = z0; z >= z1 - 1; z -= 455){                                                // 垂木
    for (const side of [-1, 1]){
      const geo = new THREE.BoxGeometry(L, 105, 45);
      const m = new THREE.Mesh(geo, mat('rafter'));
      const cx = RX + side * RUN / 2;
      m.position.set(cx, yb(cx) + 60, z); m.rotation.z = -side * ANG; g.add(m);
    }
  }
  const rg = groups[10];
  for (const gz of [Z(0), Z(NY)]){                                                        // 妻壁（三角の壁）
    const sh = new THREE.Shape(); sh.moveTo(X(0), H.noki); sh.lineTo(X(NX), H.noki); sh.lineTo(RX, yb(RX)); sh.closePath();
    const m = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, {depth: 120, bevelEnabled: false}),
      mat('wall', {transparent: true, opacity: 0.92}));
    m.position.z = gz - 60; rg.add(m); wallMeshes.push(m);
  }
  for (const side of [-1, 1]){                                                            // 屋根面
    const geo = new THREE.BoxGeometry(L + 40, 60, Math.abs(z1 - z0));
    const m = new THREE.Mesh(geo, mat('roof'));
    const cx = RX + side * RUN / 2;
    m.position.set(cx, yb(cx) + 105 + 45, (z0 + z1) / 2); m.rotation.z = -side * ANG; rg.add(m);
  }
})();

// ---------- 地面・通り芯・高さのものさし
(function(){
  const g = new THREE.Group(); scene.add(g);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40000, 40000),
    new THREE.MeshLambertMaterial({color: 0xd9d3c6, transparent: true, opacity: 0.35}));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -2; g.add(ground);
  const gm = new THREE.LineBasicMaterial({color: COL.grid, transparent: true, opacity: 0.6});
  const pts = [];
  for (let i = 0; i <= NX * 2; i++){ pts.push(new THREE.Vector3(X(i / 2), 1, Z(0)), new THREE.Vector3(X(i / 2), 1, Z(NY))); }
  for (let j = 0; j <= NY * 2; j++){ pts.push(new THREE.Vector3(X(0), 1, Z(j / 2)), new THREE.Vector3(X(NX), 1, Z(j / 2))); }
  g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), gm));
  const am = new THREE.LineBasicMaterial({color: COL.axis});
  const ap = [], ext = 900;
  for (const [gx] of DATA.xlines) ap.push(new THREE.Vector3(X(gx), 2, Z(0) + ext), new THREE.Vector3(X(gx), 2, Z(NY) - ext));
  for (const [gy] of DATA.ylines) ap.push(new THREE.Vector3(X(0) - ext, 2, Z(gy)), new THREE.Vector3(X(NX) + ext, 2, Z(gy)));
  g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(ap), am));
  for (const [gx, nm] of DATA.xlines){ const s = label(nm, 380, '#b8432b'); s.position.set(X(gx), 60, Z(0) + ext + 300); g.add(s); }
  for (const [gy, nm] of DATA.ylines){ const s = label(nm, 380, '#b8432b'); s.position.set(X(0) - ext - 300, 60, Z(gy)); g.add(s); }
  const ns = label('南（道路）', 420, '#6f675c'); ns.position.set(X(NX / 2), 60, Z(0) + 2200); g.add(ns);
  // 高さのものさし（東側）
  const rx = X(NX) + 1500, rz = Z(0);
  const rp = [new THREE.Vector3(rx, 0, rz), new THREE.Vector3(rx, H.top, rz)];
  for (const [y, t] of [[0, 'GL ±0'], [FL[1], '1FL +550'], [FL[2], '2FL +3,650'], [FL[3], '3FL +6,550'], [H.noki, '軒高 +9,350'], [H.top, '最高の高さ +10,806']]){
    rp.push(new THREE.Vector3(rx - 150, y, rz), new THREE.Vector3(rx + 150, y, rz));
    const s = label(t, 330, '#26221d', 'rgba(255,255,255,.75)'); s.position.set(rx + 1250, y, rz); g.add(s);
  }
  g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(rp), new THREE.LineBasicMaterial({color: 0x6f675c})));
})();

// ---------- カメラ（自前のオービット）
const target = new THREE.Vector3(X(NX / 2), 4600, Z(NY / 2));
const cam = {theta: -0.75, phi: 1.02, r: 26000};
const VIEWS = {se: [-0.75, 1.02, 26000], s: [0, 1.25, 26000], e: [Math.PI / 2, 1.2, 26000], top: [0, 0.06, 24000]};
function applyCam(){
  cam.phi = Math.max(0.05, Math.min(1.5, cam.phi)); cam.r = Math.max(6000, Math.min(60000, cam.r));
  camera.position.set(target.x + cam.r * Math.sin(cam.phi) * Math.sin(cam.theta),
                      target.y + cam.r * Math.cos(cam.phi),
                      target.z + cam.r * Math.sin(cam.phi) * Math.cos(cam.theta));
  camera.lookAt(target);
}
const el = renderer.domElement; let drag = null, pinch = null;
el.addEventListener('pointerdown', e => { drag = {x: e.clientX, y: e.clientY}; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', e => {
  if (!drag || pinch) return;
  if (walk.active){ walk.yaw -= (e.clientX - drag.x) * 0.005; walk.pitch = Math.max(-1.2, Math.min(1.2, walk.pitch - (e.clientY - drag.y) * 0.004)); walk.lookedAt = performance.now(); }
  else { cam.theta -= (e.clientX - drag.x) * 0.006; cam.phi -= (e.clientY - drag.y) * 0.006; applyCam(); }
  drag = {x: e.clientX, y: e.clientY};
});
el.addEventListener('pointerup', () => { drag = null; });
el.addEventListener('wheel', e => { e.preventDefault(); if (walk.active) return; cam.r *= Math.exp(e.deltaY * 0.0012); applyCam(); }, {passive: false});
el.addEventListener('touchstart', e => { if (e.touches.length === 2) pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }, {passive: true});
el.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinch){ const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); cam.r *= pinch / d; pinch = d; applyCam(); }
}, {passive: true});
el.addEventListener('touchend', () => { pinch = null; });
document.querySelectorAll('#views button').forEach(b => b.addEventListener('click', () => { if (walk.active) exitWalk(); [cam.theta, cam.phi, cam.r] = VIEWS[b.dataset.v]; applyCam(); }));

// ---------- 段階・表示
let step = STEPS.length - 1, timer = null;
const stepsEl = document.getElementById('steps');
STEPS.forEach(([name], i) => {
  const li = document.createElement('li'); const b = document.createElement('button');
  b.innerHTML = `<span class="k">${String(i).padStart(2, '0')}</span><span>${name}</span>`;
  b.addEventListener('click', () => { if (walk.active) exitWalk(); setStep(i); stopPlay(); }); li.appendChild(b); stepsEl.appendChild(li);
});
const floorOn = () => ({0: f1.checked, 1: f1.checked, 2: f2.checked, 3: f3.checked, 4: f4.checked});
function refresh(){
  const on = floorOn(), gap = +document.getElementById('explode').value;
  groups.forEach((g, i) => { g.visible = i <= step && on[g.userData.level]; g.position.y = g.userData.level * gap; });
  const showL = document.getElementById('labels').checked;
  [1, 2, 3].forEach(n => { const gi = {1: 2, 2: 5, 3: 8}[n]; labelGroups[n].visible = showL && groups[gi].visible && !(typeof walk !== 'undefined' && walk.active); labelGroups[n].position.y = groups[gi].position.y; });
  const w = document.getElementById('walls').checked;
  wallMeshes.forEach(m => { m.material.opacity = w ? 0.92 : 0.12; });
  [...stepsEl.querySelectorAll('button')].forEach((b, i) => { b.className = i === step ? 'on' : (i < step ? 'done' : 'todo'); });
  const [name, , text, sheet] = STEPS[step];
  document.querySelector('#cap .n').textContent = 'STEP ' + String(step).padStart(2, '0') + ' / ' + (STEPS.length - 1);
  capT.textContent = name; capP.textContent = text; capS.innerHTML = '答案では → <b>' + sheet + '</b>';
}
function setStep(i){ step = Math.max(0, Math.min(STEPS.length - 1, i)); refresh(); }
function stopPlay(){ if (timer){ clearInterval(timer); timer = null; } play.textContent = '▶ 順番に建てる'; }
play.addEventListener('click', () => {
  if (walk.active) exitWalk();
  if (timer){ stopPlay(); return; }
  setStep(0); play.textContent = '■ 止める';
  timer = setInterval(() => { if (step >= STEPS.length - 1){ stopPlay(); return; } setStep(step + 1); }, 1500);
});
prev.addEventListener('click', () => { stopPlay(); setStep(step - 1); });
next.addEventListener('click', () => { stopPlay(); setStep(step + 1); });
['f1', 'f2', 'f3', 'f4', 'walls', 'labels', 'explode'].forEach(id => document.getElementById(id).addEventListener('input', refresh));
addEventListener('keydown', e => { if (walk.active) return; if (e.key === 'ArrowRight') next.click(); if (e.key === 'ArrowLeft') prev.click(); });

// ---------- 内覧（玄関から歩く）。部屋どうしは、図面にある建具の位置でつなぐ
const EYE = 1500, SPEED = 1700;   // 目の高さ mm、歩く速さ mm/s
const ROOMS = [];
for (const n of [1, 2, 3]) DATA.floors[n].rooms.forEach(([nm, ar, a, b, c, e], i) =>
  ROOMS.push({key: n + ':' + i, n, name: nm.replace(/[\s\u3000]+/g, ''), area: ar, a, b, c, e,
              x: X((a + c) / 2), z: Z((b + e) / 2), y: FL[n] + EYE}));
const NOTES = {
  '住宅玄関': '道路から直接入る。土間は GL+150、ホールは GL+550。下足入れ。',
  '階段': '1階から3階まで同じ位置（直通階段）。まわりは竪穴区画。',
  '店舗売場': '道路に面した出入口（▲）。陳列棚とレジカウンター。',
  '厨房・作業場': '売場のすぐ裏。流し台・調理台・作業台・オーブン。勝手口は北。',
  '店舗用便所': 'お客が使う。洋式便器と手洗い器。売場から直接。',
  '居間・食事室・台所': '25㎡以上を1室に。南のバルコニーへ掃き出し窓。',
  '和室6帖': '押入れつき。居間と引込み戸でつながる。',
  '子供室A': '道路側の窓は直径1mの円が入る大きさ（代替進入口）。',
  '子供室B': '子供室Aと同じ大きさ。ベッド・机・収納。',
  '夫婦寝室': '13㎡以上。ベッド2台と収納。',
  '廊下': '階段から各室へ。行けない部屋を作らないための背骨。',
};
const ADJ = new Map();
function link(k1, k2, via){ (ADJ.get(k1) || ADJ.set(k1, []).get(k1)).push({to: k2, via}); (ADJ.get(k2) || ADJ.set(k2, []).get(k2)).push({to: k1, via}); }
(function(){
  const eps = 0.01;
  for (const n of [1, 2, 3]){
    const rs = ROOMS.filter(r => r.n === n), d = DATA.floors[n];
    for (const A of rs) for (const B of rs){
      if (A === B) continue;
      if (Math.abs(A.c - B.a) < eps){                              // 東西にとなり合う
        const o0 = Math.max(A.b, B.b), o1 = Math.min(A.e, B.e);
        for (const [o, w, p, l] of d.doors) if (o === 'V' && Math.abs(w - A.c) < eps && p >= o0 - eps && p + l <= o1 + eps)
          link(A.key, B.key, {x: X(w), z: Z(p + l / 2)});
      }
      if (Math.abs(A.e - B.b) < eps){                              // 南北にとなり合う
        const o0 = Math.max(A.a, B.a), o1 = Math.min(A.c, B.c);
        for (const [o, w, p, l] of d.doors) if (o === 'H' && Math.abs(w - A.e) < eps && p >= o0 - eps && p + l <= o1 + eps)
          link(A.key, B.key, {x: X(p + l / 2), z: Z(w)});
      }
    }
    const st = rs.find(r => r.name === '階段'), up = ROOMS.find(r => r.n === n + 1 && r.name === '階段');
    if (st && up) link(st.key, up.key, {x: up.x, z: up.z, y: up.y});
    if (n === 1) for (const [f, p, l, k, lab] of d.openings) if (k === 'entry' && f === 'S'){
      const r = rs.find(r => r.b === 0 && r.a <= p + eps && r.c >= p + l - eps);
      if (r) link('out:' + lab, r.key, {x: X(p + l / 2), z: Z(0)});
    }
  }
})();
const OUT = {key: 'out:住宅玄関', x: 0, z: 0, y: FL[1] + EYE, name: '道路（玄関の前）', n: 1};
(function(){ const e = (ADJ.get(OUT.key) || [])[0]; if (e){ OUT.x = e.via.x; OUT.z = e.via.z + 3000; } })();
function node(key){ return key.startsWith('out') ? OUT : ROOMS.find(r => r.key === key); }
function route(from, to){
  const prev = new Map([[from, null]]), q = [from];
  while (q.length){ const k = q.shift(); if (k === to) break; for (const e of ADJ.get(k) || []) if (!prev.has(e.to)){ prev.set(e.to, {k, via: e.via}); q.push(e.to); } }
  if (!prev.has(to)) return null;
  const nodes = []; for (let k = to; k; k = (prev.get(k) || {}).k) nodes.unshift(k);
  const pts = [];
  for (let i = 1; i < nodes.length; i++){
    const e = prev.get(nodes[i]), nd = node(nodes[i]);
    pts.push({x: e.via.x, y: e.via.y !== undefined ? e.via.y : node(nodes[i - 1]).y, z: e.via.z});
    pts.push({x: nd.x, y: nd.y, z: nd.z});
  }
  return pts;
}
const walk = {active: false, at: OUT.key, pos: {x: OUT.x, y: OUT.y, z: OUT.z}, yaw: Math.PI, pitch: -0.06,
              path: [], seg: 0, hold: 0, queue: [], lookedAt: 0};
const TOUR = ['1:住宅玄関', '1:階段', '2:階段', '2:居間・食事室・台所', '2:和室6帖', '2:家事室・納戸', '2:洗面脱衣室', '2:浴室', '2:便所',
              '3:階段', '3:廊下', '3:子供室A', '3:子供室B', '3:夫婦寝室', '3:納戸', '3:便所',
              '1:店舗売場', '1:厨房・作業場', '1:スタッフルーム', '1:店舗用便所', '1:倉庫']
  .map(t => { const [n, nm] = t.split(':'); const r = ROOMS.find(r => r.n === +n && r.name === nm); return r && r.key; }).filter(Boolean);
const roomsEl = document.getElementById('rooms');
for (const n of [3, 2, 1]){
  const row = document.createElement('div'); row.className = 'fl'; row.innerHTML = `<b>${n}F</b>`;
  for (const r of ROOMS.filter(r => r.n === n)){ const b = document.createElement('button'); b.textContent = r.name; b.dataset.key = r.key;
    b.addEventListener('click', () => { walk.queue = []; goTo(r.key); }); row.appendChild(b); }
  roomsEl.appendChild(row);
}
let orbitFov = camera.fov;
function enterWalk(){
  if (walk.active) return;
  walk.active = true; document.body.classList.add('walk'); exit.hidden = false;
  camera.fov = 68; camera.updateProjectionMatrix();
  setStep(STEPS.length - 1); document.getElementById('explode').value = 0; refresh();
  Object.values(labelGroups).forEach(g => g.visible = false);
  walk.at = OUT.key; walk.pos = {x: OUT.x, y: OUT.y, z: OUT.z}; walk.yaw = Math.PI; walk.pitch = -0.06; walk.path = []; walk.hold = 0;
  showRoom(OUT.key);
}
function exitWalk(){
  walk.active = false; walk.queue = []; walk.path = []; document.body.classList.remove('walk'); exit.hidden = true;
  camera.fov = orbitFov; camera.updateProjectionMatrix(); applyCam(); refresh();
}
function goTo(key){
  if (!walk.active) enterWalk();
  const pts = route(walk.at, key); if (!pts) return;
  walk.path = pts; walk.seg = 0; walk.target = key; walk.hold = 0;
  roomsEl.querySelectorAll('button').forEach(b => b.classList.toggle('here', b.dataset.key === key));
}
function showRoom(key){
  const r = node(key);
  document.querySelector('#cap .n').textContent = key.startsWith('out') ? '内覧　スタート' : `内覧　${r.n}階`;
  capT.textContent = r.name; capP.textContent = key.startsWith('out') ? '道路から住宅玄関へ。店とは別の入口です。' : (NOTES[r.name] || '');
  capS.innerHTML = key.startsWith('out') ? '' : `床面積 <b>${r.area}㎡</b>（${(r.c - r.a)}マス × ${(r.e - r.b)}マス）`;
  roomsEl.querySelectorAll('button').forEach(b => b.classList.toggle('here', b.dataset.key === key));
}
tour.addEventListener('click', () => { enterWalk(); walk.at = OUT.key; walk.pos = {x: OUT.x, y: OUT.y, z: OUT.z}; walk.queue = TOUR.slice(); goTo(walk.queue.shift()); });
exit.addEventListener('click', exitWalk);
const keys = new Set();
addEventListener('keydown', e => { if (walk.active && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'].includes(e.key)){ keys.add(e.key); e.preventDefault(); } });
addEventListener('keyup', e => keys.delete(e.key));
let lastT = performance.now();
function walkFrame(now){
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  const p = walk.pos;
  if (walk.path.length){                                              // 自動で歩く
    const goal = walk.path[walk.seg];
    const dx = goal.x - p.x, dy = goal.y - p.y, dz = goal.z - p.z, dist = Math.hypot(dx, dy, dz);
    const stepLen = SPEED * dt;
    if (dist <= stepLen){ Object.assign(p, goal); walk.seg++;
      if (walk.seg >= walk.path.length){ walk.path = []; walk.at = walk.target; walk.hold = 2.6; showRoom(walk.at); }
    } else {
      p.x += dx / dist * stepLen; p.y += dy / dist * stepLen; p.z += dz / dist * stepLen;
      if (Math.hypot(dx, dz) > 200 && now - walk.lookedAt > 1500){
        const want = Math.atan2(dx, dz); let d = want - walk.yaw; d = Math.atan2(Math.sin(d), Math.cos(d));
        walk.yaw += d * Math.min(1, dt * 5); walk.pitch += (-0.06 - walk.pitch) * dt * 3;
      }
    }
  } else if (walk.hold > 0){                                          // 着いたら見回す
    walk.hold -= dt; if (now - walk.lookedAt > 1500) walk.yaw += Math.sin(walk.hold * 2.4) * dt * 0.9;
    if (walk.hold <= 0 && walk.queue.length) goTo(walk.queue.shift());
  } else {                                                            // キーで歩く
    const f = SPEED * 0.8 * dt;
    if (keys.has('ArrowUp') || keys.has('w')){ p.x += Math.sin(walk.yaw) * f; p.z += Math.cos(walk.yaw) * f; }
    if (keys.has('ArrowDown') || keys.has('s')){ p.x -= Math.sin(walk.yaw) * f; p.z -= Math.cos(walk.yaw) * f; }
    if (keys.has('ArrowLeft') || keys.has('a')) walk.yaw += dt * 1.6;
    if (keys.has('ArrowRight') || keys.has('d')) walk.yaw -= dt * 1.6;
  }
  camera.position.set(p.x, p.y, p.z);
  camera.lookAt(p.x + Math.sin(walk.yaw) * Math.cos(walk.pitch), p.y + Math.sin(walk.pitch), p.z + Math.cos(walk.yaw) * Math.cos(walk.pitch));
}

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize(); applyCam(); refresh();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
(function loop(){
  requestAnimationFrame(loop);
  if (walk.active) walkFrame(performance.now());
  else if (document.getElementById('spin').checked && !drag && !reduce){ cam.theta += 0.004; applyCam(); }
  renderer.render(scene, camera);
})();
</script>
