(function(){
  const box=document.getElementById('words');
  const inp=document.getElementById('wsearch');
  const hit=document.getElementById('whit');
  let last=null;
  function render(q){
    q=(q||'').trim().toLowerCase();
    let html='',cat=null,n=0;
    WORDS.forEach(w=>{
      const hay=(w[0]+w[1]+w[2]+w[3]).toLowerCase();
      if(q && hay.indexOf(q)<0) return;
      n++;
      if(w[0]!==cat){cat=w[0];html+='<h3 class="wcat">'+cat+'のことば</h3>';}
      html+='<div class="term"><p class="tn">'+w[1]
        +'<span class="ty">'+w[2]+'</span></p><p class="td">'+w[3]+'</p></div>';
    });
    box.innerHTML = n ? html
      : '<p class="fin">その言葉は入っていません。ちがう読み方でも探せます。</p>';
    hit.textContent = q ? (n+' 件') : (WORDS.length+' 語');
  }
  inp.addEventListener('input',()=>{clearTimeout(last);
    last=setTimeout(()=>render(inp.value),120);});
  render('');
})();
