ght="400" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,'IPAGothic',sans-serif">容積率　まず限度を決める：前面道路 8m × 6/10 ＝ 480%　と　都市計画 300%</text><text x="46" y="714" font-size="11.5" text-anchor="start" fill="#245a2c" font-weight="400" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,'IPAGothic',sans-serif">　　　　小さいほうを採るので 限度は 300%。198.72 ÷ 180 ＝ 110.4% → OK</text><text x="46" y="736" font-size="11.5" text-anchor="start" fill="#245a2c" font-weight="400" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,'IPAGothic',sans-serif">南に4.9mの空地ができるので、駐輪4台も住宅への通路もここに入る。</text></svg>