<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>韓麻 実戦（対AI）</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="play.css">
</head>
<body>
  <div class="wrap-play">
    <div class="topbar">
      <div class="ttl">韓麻 実戦 <span class="badge">対AI</span></div>
      <div class="controls">
        <select id="playerCount"><option value="4">4人</option><option value="3">3人</option></select>
        <button class="btn" id="newGame">新しい局</button>
        <label class="hintToggle"><input type="checkbox" id="showHint"> お手本</label>
        <a href="index.html" class="solverlink">解析ソルバー →</a>
      </div>
    </div>

    <div class="rotate-hint">端末を横向きにするとより見やすくなります📱↻</div>

    <div class="table" id="table">
      <div class="seat seat-top" id="seatTop"></div>
      <div class="seat seat-left" id="seatLeft"></div>
      <div class="pond">
        <div class="river river-top" id="riverTop"></div>
        <div class="river river-left" id="riverLeft"></div>
        <div class="pond-center" id="pondCenter"></div>
        <div class="river river-right" id="riverRight"></div>
        <div class="river river-bottom" id="riverBottom"></div>
      </div>
      <div class="seat seat-right" id="seatRight"></div>
      <div class="seat seat-bottom" id="seatBottom"></div>
    </div>

    <div class="tray">
      <div id="myMelds" class="melds"></div>
      <div id="defense" class="defense-box" style="display:none"></div>
      <div id="myHand" class="hand"></div>
      <div id="actions" class="actions"></div>
      <div id="hint" class="hint-box" style="display:none"></div>
    </div>

    <div class="panel" id="resultPanel" style="display:none"></div>
  </div>

  <div id="toast" class="toast" style="display:none"></div>

  <script type="module" src="src/play.js"></script>
</body>
</html>
